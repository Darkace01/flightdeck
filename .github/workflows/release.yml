# When a version tag (e.g. v0.2.0) is pushed: runs the full test suite (ci.yml) on every platform, then builds
# installers on Windows, macOS and Linux and publishes them to a GitHub Release. The installed app's auto-updater reads that release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The full test suite on all three platforms; nothing is built or published unless it passes.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
          if [ ! -s "release-notes/$GITHUB_REF_NAME.md" ]; then
            echo "::error::Write release-notes/$GITHUB_REF_NAME.md describing what's new before tagging"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck

      - name: Build installers
        run: npm run dist
        env:
          # No signing certificates yet; don't let electron-builder go looking for one in the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-notes

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # The hand-written notes for this version, followed by GitHub's changelog link.
          body_path: release-notes/${{ github.ref_name }}.md
          generate_release_notes: true

  # Keeps `brew install --cask darkace01/tap/pushback` current. Needs a HOMEBREW_TAP_TOKEN secret:
  # a fine-grained token with Contents: read & write on Darkace01/homebrew-tap.
  homebrew:
    name: Update Homebrew cask
    needs: publish
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - if: env.TAP_TOKEN == ''
        run: echo "::notice::HOMEBREW_TAP_TOKEN isn't set, so the cask wasn't updated. See CONTRIBUTING.md > Releasing."

      - if: env.TAP_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: Darkace01/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump version and checksums
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p '*.dmg' -D dmg
          arm=$(sha256sum dmg/*-mac-arm64.dmg | cut -d' ' -f1)
          intel=$(sha256sum dmg/*-mac-x64.dmg | cut -d' ' -f1)
          sed -i -E \
            -e "s/^  version \".*\"/  version \"$version\"/" \
            -e "s/(sha256 arm: +)\"[0-9a-f]+\"/\1\"$arm\"/" \
            -e "s/(intel: +)\"[0-9a-f]+\"/\1\"$intel\"/" \
            tap/Casks/pushback.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "pushback $version"
          git push

  # Opens a PR on microsoft/winget-pkgs for each release. Needs a WINGET_TOKEN secret (a classic token
  # with public_repo) and a fork of winget-pkgs. The very first version has to be submitted by hand.
  winget:
    name: Submit to winget
    needs: publish
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - if: env.WINGET_TOKEN == ''
        run: echo "::notice::WINGET_TOKEN isn't set, so no winget PR was opened. See CONTRIBUTING.md > Releasing."

      - if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Darkace01.Pushback
          installers-regex: '-win-x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
